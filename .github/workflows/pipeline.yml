name: Segundo Pipeline CI

on:
  pull_request:
    branches:
      - main

jobs:
  hello-ci:
    name: Build y Tests
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # INFORMACIÓN DEL ENTORNO
      # ==========================================

      - name: Mostrar información del entorno
        run: |
          echo "================================"
          echo "         PIPELINE CI"
          echo "================================"
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.head_ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "================================"

      - name: Mostrar fecha y hora
        run: date

      - name: Mostrar versión de Git
        run: git --version

      # ==========================================
      # ETAPA DE COMPILACIÓN
      # ==========================================

      - name: Compilación
        run: |
          echo "================================"
          echo "      INICIANDO COMPILACIÓN"
          echo "================================"

          echo "Verificando archivos del proyecto..."

          test -f README.md
          echo "✓ README.md encontrado"

          test -f hello.txt
          echo "✓ hello.txt encontrado"

          echo ""
          echo "================================"
          echo "   COMPILACIÓN EXITOSA"
          echo "================================"

      # ==========================================
      # PREPARAR PRUEBAS
      # ==========================================

      - name: Preparar pruebas
        run: |
          mkdir -p tests
          mkdir -p reports

          echo "Reporte de ejecución de pruebas" > reports/test-report.txt
          echo "================================" >> reports/test-report.txt
          echo "" >> reports/test-report.txt

          cat > tests/test.sh <<'EOF'
          #!/bin/bash

          echo "================================"
          echo "       EJECUTANDO PRUEBAS"
          echo "================================"

          RESULTADO=0

          echo ""
          echo "Prueba 1: Verificar README.md"

          if test -f README.md; then
            echo "✓ README.md existe"
            echo "Prueba 1: OK" >> reports/test-report.txt
          else
            echo "✗ README.md no existe"
            echo "Prueba 1: FALLÓ" >> reports/test-report.txt
            RESULTADO=1
          fi


          echo ""
          echo "Prueba 2: Verificar hello.txt"

          if test -f hello.txt; then
            echo "✓ hello.txt existe"
            echo "Prueba 2: OK" >> reports/test-report.txt
          else
            echo "✗ hello.txt no existe"
            echo "Prueba 2: FALLÓ" >> reports/test-report.txt
            RESULTADO=1
          fi


          echo ""
          echo "Prueba 3: Verificar contenido de hello.txt"

          if test -f hello.txt && grep -q "Hola" hello.txt; then
            echo "✓ hello.txt contiene la palabra Hola"
            echo "Prueba 3: OK" >> reports/test-report.txt
          else
            echo "✗ hello.txt no contiene la palabra Hola"
            echo "Prueba 3: FALLÓ" >> reports/test-report.txt
            RESULTADO=1
          fi


          echo ""
          echo "================================"

          if [ $RESULTADO -eq 0 ]; then
            echo "    TODAS LAS PRUEBAS OK"
            echo "" >> reports/test-report.txt
            echo "Resultado final: EXITOSO" >> reports/test-report.txt
          else
            echo "    ALGUNAS PRUEBAS FALLARON"
            echo "" >> reports/test-report.txt
            echo "Resultado final: FALLÓ" >> reports/test-report.txt
          fi

          echo "================================"

          exit $RESULTADO
          EOF

          chmod +x tests/test.sh

      # ==========================================
      # EJECUTAR PRUEBAS
      # ==========================================

      - name: Ejecutar pruebas
        run: |
          ./tests/test.sh

      # ==========================================
      # MOSTRAR REPORTE
      # Se ejecuta incluso si las pruebas fallan
      # ==========================================

      - name: Mostrar reporte de pruebas
        if: always()
        run: |
          echo "================================"
          echo "       REPORTE DE PRUEBAS"
          echo "================================"

          cat reports/test-report.txt

          echo "================================"

      # ==========================================
      # PUBLICAR REPORTE COMO ARTIFACT
      # Se ejecuta incluso si las pruebas fallan
      # ==========================================

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: reports/test-report.txt

      # ==========================================
      # FINALIZAR PIPELINE
      # Solo se ejecuta si todo salió correctamente
      # ==========================================

      - name: Finalizar pipeline
        run: |
          echo "================================"
          echo "   PIPELINE EJECUTADO CORRECTAMENTE"
          echo "================================"